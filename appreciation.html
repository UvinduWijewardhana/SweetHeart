<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>A thank-you gift for you</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=6">
</head>
<body class="ap">
<div class="blob a"></div><div class="blob b"></div>
<div class="petals fixedp" id="pet" aria-hidden="true"></div>
<main class="apwrap">
  <header class="aph"><span class="aplogo" id="aplogo"></span><span id="apco"></span></header>
  <section class="apcard" id="apmain">
    <span class="eyebrow">A thank-you gift for you</span>
    <h1 id="apname"></h1>
    <p class="aprole" id="aprole"></p>
    <p class="apmsg" id="apmsg"></p>
    <p class="apsig" id="apsig"></p>
    <div class="ticket"><div class="tic" id="apic"></div><div><small>Your gift</small><b id="apgift"></b><span id="apgd"></span></div></div>
  </section>
  <section class="apcard" id="apsel">
    <span class="eyebrow">Your day</span>
    <h2 id="bhead">Your gift is booked for</h2>
    <div class="book" id="book">
      <div class="bdate"><small id="bwk">Tuesday</small><b id="bday">6</b><span id="bmon">October 2026</span></div>
      <div class="bclock"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#e8a0b4" stroke-width="3"/><g stroke="#e8a0b4" stroke-width="2" stroke-linecap="round" id="ticks"></g><line id="hh" x1="50" y1="50" x2="50" y2="28" stroke="#a3334f" stroke-width="4.5" stroke-linecap="round"/><line id="mh" x1="50" y1="50" x2="50" y2="17" stroke="#e63e6d" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="#a3334f"/></svg><b id="btime">3:30 PM</b></div>
    </div>
    <p class="aphint" id="aphint">Please let us know you got it, so we are ready for you.</p>
    <a class="btn fill full" id="apgo" target="_blank" rel="noopener">Confirm on WhatsApp</a>
    <a class="btn ghost full" id="apalt" target="_blank" rel="noopener" style="margin-top:10px">I need a different time</a>
  </section>
  <section class="apcard apdone" id="apdone" hidden>
    <div class="big"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2>Thank you!</h2>
    <p class="aphint" id="apdonetxt"></p>
    <button class="btn ghost full" type="button" id="apchange">Change my choice</button>
  </section>
  <p class="apfoot">Made with <a href="index.html">SweetHeart</a></p>
</main>
<script src="js/config.js?v=6"></script>
